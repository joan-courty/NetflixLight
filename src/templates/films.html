<!DOCTYPE html>
<html lang="UTF-8">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NetflixLight</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="min-h-screen bg-gradient-to-br from-slate-950 via-slate-700 to-slate-950 text-white antialiased font-sans">
<header class="container mx-auto px-6 py-8">
    <div class="text-center mb-10">
        <h1 class="text-5xl md:text-6xl font-extrabold mb-4">
            <span class="text-transparent bg-clip-text bg-gradient-to-r from-red-900 to-red-700 text-6xl md:text-7xl" style="-webkit-text-stroke: 0.5px #fff;">N</span><span class="text-transparent bg-clip-text text-white" style="-webkit-text-stroke: 0.5px #fff;">etflix<span class="text-transparent bg-clip-text bg-gradient-to-r from-red-900 to-red-700 text-6xl md:text-7xl" style="-webkit-text-stroke: 0.5px #fff;">L</span><span class="text-transparent bg-clip-text text-white" style="-webkit-text-stroke: 0.5px #fff;">ight</span>
        </h1>
    </div>

    <nav class="bg-white/10 backdrop-blur-md border border-white/20 rounded-2xl p-4 shadow-xl max-w-6xl mx-auto">
        <div class="flex flex-col md:flex-row items-center justify-between gap-4">
            
            <ul class="flex space-x-2 md:space-x-4">
                <li>
                    <a href="/" class="block px-4 py-2 hover:bg-white/10 text-white font-semibold rounded-lg transition duration-200 border border-transparent hover:border-white/20 text-sm md:text-base">
                        Home
                    </a>
                </li>
                <li>
                    <a href="/films" class="block px-4 py-2 bg-red-900 hover:bg-red-800 text-white font-semibold rounded-lg transition duration-200 shadow-lg shadow-red-500/30 text-sm md:text-base">
                        Films
                    </a>
                </li>
                <li>
                    <a href="/login" class="block px-4 py-2 hover:bg-white/10 text-white font-semibold rounded-lg transition duration-200 border border-transparent hover:border-white/20 text-sm md:text-base">
                        Login
                    </a>
                </li>
            </ul>
        </div>
    </nav>
</header>
<main>
    <div class="max-w-6xl mx-auto px-6 mt-12">
        
        <h2 class="text-2xl font-bold text-white border-l-4 border-red-900 pl-4 mb-8">
            Films
        </h2>
    <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-10">
            
            <div class="flex flex-col gap-4 w-full">
                <div class="aspect-square bg-white/10 backdrop-blur-md border border-white/20 rounded-2xl overflow-hidden hover:bg-white/20 transition duration-300 relative">
                    <img src="https://via.placeholder.com/300x300?text=Inception" alt="Inception" class="w-full h-full object-cover">
                    <h3 class="absolute bottom-0 left-0 right-0 text-white text-center font-bold text-xl uppercase tracking-wider bg-black/50 p-2">
                            Inception
                    </h3>
                </div>
            </div>
            <div class="flex flex-col gap-4 w-full">
                <div class="aspect-square bg-white/10 backdrop-blur-md border border-white/20 rounded-2xl overflow-hidden hover:bg-white/20 transition duration-300 relative">
                    <img src="https://via.placeholder.com/300x300?text=Dark+Knight" alt="The Dark Knight" class="w-full h-full object-cover">
                    <h3 class="absolute bottom-0 left-0 right-0 text-white text-center font-bold text-xl uppercase tracking-wider bg-black/50 p-2">
                            The Dark Knight
                    </h3>
                </div>
            </div>
            <div class="flex flex-col gap-4 w-full">
                <div class="aspect-square bg-white/10 backdrop-blur-md border border-white/20 rounded-2xl overflow-hidden hover:bg-white/20 transition duration-300 relative">
                    <img src="https://via.placeholder.com/300x300?text=Interstellar" alt="Interstellar" class="w-full h-full object-cover">
                    <h3 class="absolute bottom-0 left-0 right-0 text-white text-center font-bold text-xl uppercase tracking-wider bg-black/50 p-2">
                            Interstellar
                    </h3>
                </div>
            </div>

        </div>
    </div>
</main>

</body>
</html>
